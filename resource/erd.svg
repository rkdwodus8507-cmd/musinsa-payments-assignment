<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1b2733; }
      .subtitle { font-size: 13px; fill: #5b6b7c; }
      .tname { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .tnote { font-size: 11px; fill: #e6edf3; }
      .col { font-size: 12.5px; fill: #22303c; }
      .colpk { font-size: 12.5px; font-weight: 700; fill: #0b4f6c; }
      .type { font-size: 11.5px; fill: #78899a; }
      .rel { font-size: 11.5px; fill: #5b6b7c; font-style: italic; }
      .legend { font-size: 12px; fill: #3c4a58; }
      .box { fill: #ffffff; stroke: #c9d4de; stroke-width: 1.4; }
      .hdr-core { fill: #0b4f6c; }
      .hdr-earn { fill: #1a7f5a; }
      .hdr-use { fill: #a35a12; }
      .hdr-cfg { fill: #5a4a8a; }
      .line { stroke: #5b6b7c; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f6f8fa"/>
  <text x="40" y="48" class="title">무료 포인트 시스템 ERD</text>
  <text x="40" y="72" class="subtitle">잔액은 별도 컬럼으로 저장하지 않는다. 잔액 = SUM(earned_point.remaining_amount) WHERE status='AVAILABLE' AND expire_at &gt; now()</text>

  <!-- point_policy -->
  <g>
    <rect x="40" y="110" width="270" height="196" rx="8" class="box"/>
    <path d="M40 118 a8 8 0 0 1 8 -8 h254 a8 8 0 0 1 8 8 v30 h-270 z" class="hdr-cfg"/>
    <text x="56" y="132" class="tname">point_policy</text>
    <text x="56" y="145" class="tnote">단일 행. 런타임에 변경 가능한 정책</text>
    <text x="56" y="172" class="colpk">PK  id</text><text x="240" y="172" class="type">bigint</text>
    <text x="56" y="192" class="col">min_earn_amount</text><text x="240" y="192" class="type">bigint</text>
    <text x="56" y="212" class="col">max_earn_amount</text><text x="240" y="212" class="type">bigint</text>
    <text x="56" y="232" class="col">max_user_balance</text><text x="240" y="232" class="type">bigint</text>
    <text x="56" y="252" class="col">default_expire_days</text><text x="248" y="252" class="type">int</text>
    <text x="56" y="272" class="col">min_expire_days</text><text x="248" y="272" class="type">int</text>
    <text x="56" y="292" class="col">max_expire_days</text><text x="248" y="292" class="type">int</text>
  </g>

  <!-- user_point_lock -->
  <g>
    <rect x="40" y="356" width="270" height="136" rx="8" class="box"/>
    <path d="M40 364 a8 8 0 0 1 8 -8 h254 a8 8 0 0 1 8 8 v30 h-270 z" class="hdr-cfg"/>
    <text x="56" y="378" class="tname">user_point_lock</text>
    <text x="56" y="391" class="tnote">잔액 없음. 사용자 단위 락 대상</text>
    <text x="56" y="418" class="colpk">PK  id</text><text x="240" y="418" class="type">bigint</text>
    <text x="56" y="438" class="colpk">UK  user_id</text><text x="240" y="438" class="type">bigint</text>
    <text x="56" y="458" class="col">created_at</text><text x="216" y="458" class="type">timestamp</text>
    <text x="56" y="480" class="rel">SELECT ... FOR UPDATE 로 직렬화</text>
  </g>

  <!-- point_transaction -->
  <g>
    <rect x="420" y="110" width="310" height="276" rx="8" class="box"/>
    <path d="M420 118 a8 8 0 0 1 8 -8 h294 a8 8 0 0 1 8 8 v30 h-310 z" class="hdr-core"/>
    <text x="436" y="132" class="tname">point_transaction</text>
    <text x="436" y="145" class="tnote">pointKey 를 부여받는 모든 거래 이벤트</text>
    <text x="436" y="172" class="colpk">PK  id</text><text x="650" y="172" class="type">bigint</text>
    <text x="436" y="192" class="colpk">UK  point_key</text><text x="630" y="192" class="type">varchar(36)</text>
    <text x="436" y="212" class="col">user_id</text><text x="650" y="212" class="type">bigint</text>
    <text x="436" y="232" class="col">type</text><text x="630" y="232" class="type">varchar(20)</text>
    <text x="436" y="252" class="col">amount</text><text x="650" y="252" class="type">bigint</text>
    <text x="436" y="272" class="col">order_id</text><text x="630" y="272" class="type">varchar(64)</text>
    <text x="436" y="292" class="col">related_transaction_id</text><text x="650" y="292" class="type">bigint</text>
    <text x="436" y="312" class="colpk">UK  request_key</text><text x="630" y="312" class="type">varchar(64)</text>
    <text x="436" y="332" class="col">memo</text><text x="622" y="332" class="type">varchar(255)</text>
    <text x="436" y="352" class="col">created_at</text><text x="622" y="352" class="type">timestamp</text>
    <text x="436" y="374" class="rel">EARN / EARN_CANCEL / USE / USE_CANCEL</text>
  </g>

  <!-- earned_point -->
  <g>
    <rect x="420" y="450" width="310" height="256" rx="8" class="box"/>
    <path d="M420 458 a8 8 0 0 1 8 -8 h294 a8 8 0 0 1 8 8 v30 h-310 z" class="hdr-earn"/>
    <text x="436" y="472" class="tname">earned_point</text>
    <text x="436" y="485" class="tnote">EARN 거래와 1:1. 잔액의 유일한 원천</text>
    <text x="436" y="512" class="colpk">PK  id</text><text x="650" y="512" class="type">bigint</text>
    <text x="436" y="532" class="colpk">UK,FK  transaction_id</text><text x="650" y="532" class="type">bigint</text>
    <text x="436" y="552" class="col">user_id</text><text x="650" y="552" class="type">bigint</text>
    <text x="436" y="572" class="col">original_amount</text><text x="650" y="572" class="type">bigint</text>
    <text x="436" y="592" class="col">remaining_amount</text><text x="650" y="592" class="type">bigint</text>
    <text x="436" y="612" class="col">manual</text><text x="642" y="612" class="type">boolean</text>
    <text x="436" y="632" class="col">status</text><text x="630" y="632" class="type">varchar(20)</text>
    <text x="436" y="652" class="col">expire_at</text><text x="622" y="652" class="type">timestamp</text>
    <text x="436" y="672" class="col">created_at</text><text x="622" y="672" class="type">timestamp</text>
    <text x="436" y="694" class="rel">AVAILABLE / EXPIRED / CANCELED</text>
  </g>

  <!-- point_usage -->
  <g>
    <rect x="840" y="200" width="320" height="216" rx="8" class="box"/>
    <path d="M840 208 a8 8 0 0 1 8 -8 h304 a8 8 0 0 1 8 8 v30 h-320 z" class="hdr-use"/>
    <text x="856" y="222" class="tname">point_usage</text>
    <text x="856" y="235" class="tnote">1원 단위 사용 추적의 핵심</text>
    <text x="856" y="262" class="colpk">PK  id</text><text x="1080" y="262" class="type">bigint</text>
    <text x="856" y="282" class="colpk">FK  use_transaction_id</text><text x="1080" y="282" class="type">bigint</text>
    <text x="856" y="302" class="colpk">FK  earned_point_id</text><text x="1080" y="302" class="type">bigint</text>
    <text x="856" y="322" class="col">order_id</text><text x="1052" y="322" class="type">varchar(64)</text>
    <text x="856" y="342" class="col">amount</text><text x="1080" y="342" class="type">bigint</text>
    <text x="856" y="362" class="col">canceled_amount</text><text x="1080" y="362" class="type">bigint</text>
    <text x="856" y="382" class="col">created_at</text><text x="1044" y="382" class="type">timestamp</text>
    <text x="856" y="404" class="rel">"어떤 주문이 어떤 적립분을 얼마 썼는가"</text>
  </g>

  <!-- point_usage_cancellation -->
  <g>
    <rect x="840" y="470" width="320" height="216" rx="8" class="box"/>
    <path d="M840 478 a8 8 0 0 1 8 -8 h304 a8 8 0 0 1 8 8 v30 h-320 z" class="hdr-use"/>
    <text x="856" y="492" class="tname">point_usage_cancellation</text>
    <text x="856" y="505" class="tnote">부분 사용취소가 여러 번 발생하므로 분리</text>
    <text x="856" y="532" class="colpk">PK  id</text><text x="1080" y="532" class="type">bigint</text>
    <text x="856" y="552" class="colpk">FK  cancel_transaction_id</text><text x="1080" y="552" class="type">bigint</text>
    <text x="856" y="572" class="colpk">FK  point_usage_id</text><text x="1080" y="572" class="type">bigint</text>
    <text x="856" y="592" class="col">amount</text><text x="1080" y="592" class="type">bigint</text>
    <text x="856" y="612" class="colpk">FK  restored_earned_point_id</text><text x="1080" y="612" class="type">bigint</text>
    <text x="856" y="632" class="colpk">FK  reissued_earned_point_id</text><text x="1080" y="632" class="type">bigint</text>
    <text x="856" y="652" class="col">created_at</text><text x="1044" y="652" class="type">timestamp</text>
    <text x="856" y="674" class="rel">복원 / 만료로 인한 재적립을 구분 기록</text>
  </g>

  <!-- relations -->
  <path d="M575 386 L575 450" class="line" marker-end="url(#arrow)"/>
  <text x="585" y="422" class="rel">1 : 1 (EARN)</text>

  <path d="M730 240 L785 240 L785 300 L840 300" class="line" marker-end="url(#arrow)"/>
  <text x="736" y="232" class="rel">1 : N</text>

  <path d="M730 565 L790 565 L790 340 L840 340" class="line" marker-end="url(#arrow)"/>
  <text x="736" y="583" class="rel">1 : N</text>

  <path d="M1000 416 L1000 470" class="line" marker-end="url(#arrow)"/>
  <text x="1010" y="448" class="rel">1 : N</text>

  <path d="M730 292 L770 292 L770 160 L810 160 L810 555 L840 555" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="816" y="150" class="rel">1 : N (USE_CANCEL)</text>

  <path d="M310 424 L365 424 L365 220 L420 220" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="316" y="416" class="rel">user_id (논리적 참조)</text>

  <!-- legend -->
  <g transform="translate(40, 726)">
    <rect x="0" y="0" width="760" height="150" rx="8" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
    <text x="16" y="26" class="legend" font-weight="700">설계 메모</text>
    <text x="16" y="50" class="legend">· 잔액 컬럼을 두지 않아 만료 배치 지연 시에도 캐시-실제값 불일치가 발생하지 않는다.</text>
    <text x="16" y="72" class="legend">· user_point_lock 은 잔액을 갖지 않고 SELECT ... FOR UPDATE 대상으로만 존재한다.</text>
    <text x="16" y="94" class="legend">· request_key 는 (user_id, request_key) 유니크. 같은 요청 재전송 시 기존 거래 결과를 그대로 돌려준다.</text>
    <text x="16" y="116" class="legend">· 적립분 사용 순서 인덱스: (user_id, status, manual DESC, expire_at ASC, id ASC)</text>
    <text x="16" y="138" class="legend">· 모든 FK 는 애플리케이션 레벨 참조다. 인덱스는 schema.sql 참고.</text>
  </g>
</svg>
