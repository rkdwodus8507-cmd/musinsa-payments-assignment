<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1010" viewBox="0 0 1230 1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1b2733; }
      .subtitle { font-size: 13px; fill: #5b6b7c; }
      .tname { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .tnote { font-size: 11px; fill: #e6edf3; }
      .col { font-size: 12px; fill: #22303c; }
      .colpk { font-size: 12px; font-weight: 700; fill: #0b4f6c; }
      .type { font-size: 11px; fill: #78899a; }
      .rel { font-size: 11.5px; fill: #5b6b7c; font-style: italic; }
      .legend { font-size: 12px; fill: #3c4a58; }
      .box { fill: #ffffff; stroke: #c9d4de; stroke-width: 1.4; }
      .hdr-core { fill: #0b4f6c; }
      .hdr-earn { fill: #1a7f5a; }
      .hdr-use { fill: #a35a12; }
      .hdr-cfg { fill: #5a4a8a; }
      .line { stroke: #5b6b7c; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1230" height="1010" fill="#f6f8fa"/>
  <text x="40" y="46" class="title">무료 포인트 시스템 ERD</text>
  <text x="40" y="70" class="subtitle">잔액 = SUM(earned_point.remaining_amount) WHERE status='AVAILABLE' AND expire_at &gt; now() · 정규화 유지, 조회는 일괄(batch) 조회로 해결</text>

  <!-- point_policy -->
  <g>
    <rect x="40" y="110" width="270" height="190" rx="8" class="box"/>
    <path d="M40 118 a8 8 0 0 1 8 -8 h254 a8 8 0 0 1 8 8 v30 h-270 z" class="hdr-cfg"/>
    <text x="56" y="132" class="tname">point_policy</text>
    <text x="56" y="145" class="tnote">단일 행. 런타임에 변경 가능한 정책</text>
    <text x="56" y="170" class="colpk">PK  id</text><text x="244" y="170" class="type">bigint</text>
    <text x="56" y="189" class="col">min_earn_amount</text><text x="244" y="189" class="type">bigint</text>
    <text x="56" y="208" class="col">max_earn_amount</text><text x="244" y="208" class="type">bigint</text>
    <text x="56" y="227" class="col">max_user_balance</text><text x="244" y="227" class="type">bigint</text>
    <text x="56" y="246" class="col">default_expire_days</text><text x="252" y="246" class="type">int</text>
    <text x="56" y="265" class="col">min_expire_days</text><text x="252" y="265" class="type">int</text>
    <text x="56" y="284" class="col">max_expire_days</text><text x="252" y="284" class="type">int</text>
  </g>

  <!-- user_point_lock -->
  <g>
    <rect x="40" y="340" width="270" height="130" rx="8" class="box"/>
    <path d="M40 348 a8 8 0 0 1 8 -8 h254 a8 8 0 0 1 8 8 v30 h-270 z" class="hdr-cfg"/>
    <text x="56" y="362" class="tname">user_point_lock</text>
    <text x="56" y="375" class="tnote">잔액 없음. 사용자 단위 락 대상</text>
    <text x="56" y="400" class="colpk">PK  id</text><text x="244" y="400" class="type">bigint</text>
    <text x="56" y="419" class="colpk">UK  user_id</text><text x="244" y="419" class="type">bigint</text>
    <text x="56" y="438" class="col">created_at</text><text x="220" y="438" class="type">timestamp</text>
    <text x="56" y="459" class="rel">SELECT ... FOR UPDATE 로 직렬화</text>
  </g>

  <!-- point_transaction -->
  <g>
    <rect x="420" y="110" width="310" height="270" rx="8" class="box"/>
    <path d="M420 118 a8 8 0 0 1 8 -8 h294 a8 8 0 0 1 8 8 v30 h-310 z" class="hdr-core"/>
    <text x="436" y="132" class="tname">point_transaction</text>
    <text x="436" y="145" class="tnote">pointKey 를 부여받는 모든 거래 이벤트</text>
    <text x="436" y="170" class="colpk">PK  id</text><text x="656" y="170" class="type">bigint</text>
    <text x="436" y="189" class="colpk">UK  point_key</text><text x="638" y="189" class="type">varchar(36)</text>
    <text x="436" y="208" class="col">user_id</text><text x="656" y="208" class="type">bigint</text>
    <text x="436" y="227" class="col">type</text><text x="638" y="227" class="type">varchar(20)</text>
    <text x="436" y="246" class="col">amount</text><text x="656" y="246" class="type">bigint</text>
    <text x="436" y="265" class="col">order_id</text><text x="638" y="265" class="type">varchar(64)</text>
    <text x="436" y="284" class="col">related_transaction_id</text><text x="656" y="284" class="type">bigint</text>
    <text x="436" y="303" class="colpk">UK  request_key</text><text x="638" y="303" class="type">varchar(64)</text>
    <text x="436" y="322" class="col">memo</text><text x="630" y="322" class="type">varchar(255)</text>
    <text x="436" y="341" class="col">created_at</text><text x="630" y="341" class="type">timestamp</text>
    <text x="436" y="365" class="rel">EARN / EARN_CANCEL / USE / USE_CANCEL</text>
  </g>

  <!-- earned_point -->
  <g>
    <rect x="420" y="460" width="310" height="251" rx="8" class="box"/>
    <path d="M420 468 a8 8 0 0 1 8 -8 h294 a8 8 0 0 1 8 8 v30 h-310 z" class="hdr-earn"/>
    <text x="436" y="482" class="tname">earned_point</text>
    <text x="436" y="495" class="tnote">EARN 거래와 1:1. 잔액의 유일한 원천</text>
    <text x="436" y="520" class="colpk">PK  id</text><text x="656" y="520" class="type">bigint</text>
    <text x="436" y="539" class="colpk">UK,FK  transaction_id</text><text x="656" y="539" class="type">bigint</text>
    <text x="436" y="558" class="col">user_id</text><text x="656" y="558" class="type">bigint</text>
    <text x="436" y="577" class="col">original_amount</text><text x="656" y="577" class="type">bigint</text>
    <text x="436" y="596" class="col">remaining_amount</text><text x="656" y="596" class="type">bigint</text>
    <text x="436" y="615" class="col">manual</text><text x="648" y="615" class="type">boolean</text>
    <text x="436" y="634" class="col">status</text><text x="638" y="634" class="type">varchar(20)</text>
    <text x="436" y="653" class="col">expire_at</text><text x="630" y="653" class="type">timestamp</text>
    <text x="436" y="672" class="col">created_at</text><text x="630" y="672" class="type">timestamp</text>
    <text x="436" y="696" class="rel">AVAILABLE / EXPIRED / CANCELED</text>
  </g>

  <!-- point_usage -->
  <g>
    <rect x="850" y="160" width="340" height="230" rx="8" class="box"/>
    <path d="M850 168 a8 8 0 0 1 8 -8 h324 a8 8 0 0 1 8 8 v30 h-340 z" class="hdr-use"/>
    <text x="866" y="182" class="tname">point_usage</text>
    <text x="866" y="195" class="tnote">1원 단위 사용 추적의 핵심</text>
    <text x="866" y="220" class="colpk">PK  id</text><text x="1110" y="220" class="type">bigint</text>
    <text x="866" y="239" class="colpk">FK  use_transaction_id</text><text x="1110" y="239" class="type">bigint</text>
    <text x="866" y="258" class="colpk">FK  earned_point_id</text><text x="1110" y="258" class="type">bigint</text>
    <text x="866" y="277" class="col">order_id</text><text x="1092" y="277" class="type">varchar(64)</text>
    <text x="866" y="296" class="col">amount</text><text x="1110" y="296" class="type">bigint</text>
    <text x="866" y="315" class="col">canceled_amount</text><text x="1110" y="315" class="type">bigint</text>
    <text x="866" y="334" class="col">created_at</text><text x="1084" y="334" class="type">timestamp</text>
    <text x="866" y="374" class="rel">"어떤 주문이 어떤 적립분을 얼마 썼는가"</text>
  </g>

  <!-- point_usage_cancellation -->
  <g>
    <rect x="850" y="490" width="340" height="230" rx="8" class="box"/>
    <path d="M850 498 a8 8 0 0 1 8 -8 h324 a8 8 0 0 1 8 8 v30 h-340 z" class="hdr-use"/>
    <text x="866" y="512" class="tname">point_usage_cancellation</text>
    <text x="866" y="525" class="tnote">부분 사용취소가 여러 번 발생하므로 분리</text>
    <text x="866" y="550" class="colpk">PK  id</text><text x="1110" y="550" class="type">bigint</text>
    <text x="866" y="569" class="colpk">FK  cancel_transaction_id</text><text x="1110" y="569" class="type">bigint</text>
    <text x="866" y="588" class="colpk">FK  point_usage_id</text><text x="1110" y="588" class="type">bigint</text>
    <text x="866" y="607" class="col">amount</text><text x="1110" y="607" class="type">bigint</text>
    <text x="866" y="626" class="colpk">FK  source_earned_point_id</text><text x="1110" y="626" class="type">bigint</text>
    <text x="866" y="645" class="colpk">FK  reissued_earned_point_id</text><text x="1110" y="645" class="type">bigint</text>
    <text x="866" y="664" class="col">created_at</text><text x="1084" y="664" class="type">timestamp</text>
    <text x="866" y="704" class="rel">복원 / 만료로 인한 재적립을 구분 기록</text>
  </g>

  <!-- relations -->
  <path d="M575 380 L575 460" class="line" marker-end="url(#arrow)"/>
  <text x="585" y="425" class="rel">1 : 1 (EARN)</text>

  <path d="M730 239 L850 239" class="line" marker-end="url(#arrow)"/>
  <text x="756" y="231" class="rel">1 : N (USE)</text>

  <path d="M730 558 L790 558 L790 258 L850 258" class="line" marker-end="url(#arrow)"/>
  <text x="736" y="576" class="rel">1 : N</text>

  <path d="M1020 390 L1020 490" class="line" marker-end="url(#arrow)"/>
  <text x="1030" y="445" class="rel">1 : N</text>

  <path d="M730 303 L770 303 L770 100 L820 100 L820 569 L850 569" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="826" y="92" class="rel">1 : N (USE_CANCEL)</text>

  <path d="M310 405 L365 405 L365 208 L420 208" class="line" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="316" y="397" class="rel">user_id (논리적 참조)</text>

  <!-- legend -->
  <g transform="translate(40, 790)">
    <rect x="0" y="0" width="780" height="172" rx="8" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
    <text x="16" y="26" class="legend" font-weight="700">설계 메모</text>
    <text x="16" y="50" class="legend">· 잔액 컬럼을 두지 않아 만료 배치 지연 시에도 캐시-실제값 불일치가 발생하지 않는다.</text>
    <text x="16" y="72" class="legend">· user_point_lock 은 잔액을 갖지 않고 SELECT ... FOR UPDATE 대상으로만 존재한다.</text>
    <text x="16" y="94" class="legend">· request_key 는 (user_id, request_key) 유니크. 재전송 시 기존 거래 결과를 그대로 돌려준다.</text>
    <text x="16" y="116" class="legend">· 값 복사(비정규화)는 두지 않는다. pointKey 는 point_transaction 에만 있고, 상세 응답은</text>
    <text x="30" y="136" class="legend">id 목록으로 일괄 조회해 조립한다 — 적립분 수가 늘어도 조회 쿼리 수는 고정이다.</text>
    <text x="16" y="158" class="legend">· 적립분 사용 순서 인덱스: (user_id, status, manual DESC, expire_at ASC, id ASC)</text>
  </g>
</svg>
